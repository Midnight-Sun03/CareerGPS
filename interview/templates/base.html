<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerGPS – {% block title %}AI Interview Coach{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #E8651A;
      --orange-light: #F47C35;
      --orange-pale: #FFF3EC;
      --sidebar-bg: #1A1A2E;
      --sidebar-hover: #2A2A3E;
      --text-dark: #1C1C1C;
      --text-mid: #555;
      --text-light: #888;
      --border: #E5E5E5;
      --card-bg: #FFFFFF;
      --page-bg: #F7F7F7;
      --green: #27AE60;
      --green-bg: #EAFAF1;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--page-bg);
      color: var(--text-dark);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 28px 0 24px;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
    }

    .sidebar-logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--orange);
      padding: 0 24px 32px;
      letter-spacing: -0.3px;
    }

    .sidebar-logo span {
      color: #fff;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 24px;
      color: #B0B0C8;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s, color 0.18s;
      border-radius: 0;
    }

    .nav-item:hover {
      background: var(--sidebar-hover);
      color: #fff;
    }

    .nav-item.active {
      background: var(--orange);
      color: #fff;
      border-radius: 0 8px 8px 0;
      margin-right: 16px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    /* Main Content */
    .main {
      margin-left: 260px;
      flex: 1;
      padding: 32px 48px 60px;
      max-width: calc(100vw - 260px);
    }

    /* SVG Icons */
    svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 80px;
      }
      
      .sidebar-logo {
        padding: 0 16px 32px;
        font-size: 1rem;
      }
      
      .sidebar-logo span {
        display: none;
      }
      
      .nav-item span {
        display: none;
      }
      
      .main {
        margin-left: 80px;
        padding: 20px;
        max-width: calc(100vw - 80px);
      }
    }

    /* Messages */
    .django-messages {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      max-width: 360px;
    }
    .django-msg {
      padding: .75rem 1.25rem;
      border-radius: .75rem;
      font-size: .875rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      display: flex;
      align-items: center;
      gap: .6rem;
      animation: slideIn .25s ease;
    }
    .django-msg.success { background: #e8f7f0; color: #1a7a4a; border: 1px solid #b7e4cc; }
    .django-msg.error   { background: #fdf0ed; color: #c0392b; border: 1px solid #f5c6bc; }
    @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">Career<span>GPS</span></div>
    
    <a class="nav-item {% if request.resolver_match.url_name == 'welcome' %}active{% endif %}" href="{% url 'welcome' %}">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
        <polyline points="9 21 9 12 15 12 15 21" />
      </svg>
      <span>Home</span>
    </a>
    
    <a class="nav-item {% if request.resolver_match.url_name == 'opportunities' %}active{% endif %}" href="{% url 'opportunities' %}">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="14" rx="2" />
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
      </svg>
      <span>Opportunities</span>
    </a>
    
    <a class="nav-item {% if request.resolver_match.url_name == 'saved' %}active{% endif %}" href="{% url 'saved' %}">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
      </svg>
      <span>Saved</span>
    </a>
    
    <a class="nav-item {% if request.resolver_match.url_name == 'resources' %}active{% endif %}" href="{% url 'resources' %}">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
      <span>Resources</span>
    </a>
    
    <a class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span>Profile</span>
    </a>
    
    <a class="nav-item {% if request.resolver_match.url_name == 'stories' %}active{% endif %}" href="{% url 'stories' %}">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <span>Stories</span>
    </a>
    
    <a class="nav-item" href="{% url 'signin' %}" style="margin-top: auto;">
      <svg class="nav-icon" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Logout</span>
    </a>
  </aside>

  <!-- Main Content -->
  <main class="main">
    {% if messages %}
    <div class="django-messages">
      {% for message in messages %}
      <div class="django-msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    <script>
      setTimeout(() => {
        document.querySelectorAll('.django-msg').forEach(el => el.remove());
      }, 4000);
    </script>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
