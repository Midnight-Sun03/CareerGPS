{% extends "public_pages.html" %}
{% load static %}

{% block title %}
CareerGPS | Sign Out
{% endblock %}

{% block css %}

<link rel="stylesheet" href="{% static 'core/css/logout_confirm.css' %}">
{% endblock %}

{% block content %}

<div class="logout-container">

<div class="logout-card">

    <h1>Sign Out</h1>

    <p>
        Are you sure you want to sign out of your CareerGPS account?
    </p>

    <div class="logout-actions">

        <a href="{% url 'dashboard' %}" class="cancel-btn">
            Cancel
        </a>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}

            <button type="submit" class="logout-btn">
                Sign Out
            </button>
        </form>

    </div>

</div>
</div>

{% endblock %}
