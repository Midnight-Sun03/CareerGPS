{% extends "public_pages.html" %}

{% block title %}
CareerGPS - Reset Password
{% endblock %}

{% block content %}

<div class="auth-card">

<h2>Forgot your password?</h2>

<p>
Enter the email address associated with your account.
We'll generate a password reset link.
</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        Send Reset Link
    </button>
</form>

</div>

{% endblock %}
