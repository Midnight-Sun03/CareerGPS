{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CareerGPS{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    {% block css %}{% endblock %}
    <link rel="stylesheet" href="{% static 'core/css/public_legal.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/setfunctions.css' %}">

</head>

<body class="public-shell">

        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

{% block content %}
{% endblock %}

{% include 'partials/public_footer.html' %}

{% block javascript %}
{% endblock %}
<script src="{% static 'core/js/settings.js' %}"></script>

</body>
</html>
